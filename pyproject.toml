[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndpt"
version = "0.1.0"
description = "Network diagnostics and performance testing: ping and traceroute, graphically, as a GUI and a TUI."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Matthew Carven" }]
dependencies = ["rich>=13"]

[project.optional-dependencies]
# Pinned when their phases land (see PLAN.md).
tui = ["textual"]
gui = ["PySide6", "pyqtgraph"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ndpt = "ndpt.cli:main"

[tool.setuptools.packages.find]
include = ["ndpt*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["network: sends real probes (to localhost unless the test says otherwise)"]
