# Tests NDPT on Windows, Linux and macOS: on every push to main, and by hand
# (Actions > test > Run workflow).
#
#   Every system: the tests that send nothing (not the "network" ones), GUI included.
#   Linux, macOS: pings to localhost through their prober (ndpt/core/backends/posix_icmp.py).
#   Linux:        tests/netns/route.sh, a little routed network in namespaces (needs sudo).
#   Linux, macOS: a trace of 1.1.1.1, to see what real routers send back. Cloud machines
#                 may block ICMP, so it can't fail the run.
name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Libraries Qt needs on Linux, even offscreen
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install NDPT with both front ends
        run: python -m pip install -e ".[dev,tui,gui]"

      - name: Test
        run: python -m pytest -q -m "not network"

      - name: Ping localhost
        if: runner.os != 'Windows'
        run: python -m pytest -q -rs -m network tests/test_posix_icmp.py

      - name: A routed network in namespaces
        if: runner.os == 'Linux'
        run: sudo PYTHON="$(command -v python)" bash tests/netns/route.sh

      - name: Trace 1.1.1.1 (to see; may be blocked)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: python -m ndpt trace -c 5 --report 1.1.1.1
