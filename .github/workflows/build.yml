# Builds NDPT's programs (the TUI and the GUI) for Windows, Linux and macOS, each on its own
# system: PyInstaller can't build for another.
#
#   Push a tag like v0.2.0      tests, every build, and a GitHub Release with them attached.
#                               The tag must match the version in pyproject.toml and ndpt/__init__.py.
#   Actions > build > Run workflow
#                               tests and every build, downloadable from the run's page for 14 days;
#                               no release.
#
# Each build is started and quit again (packaging/smoke.py) before it's kept: that catches a
# module, library or Qt plugin left out, which tests run from source never would. Linux's also
# runs on a bare Ubuntu, with nothing installed but a display, to see what it needs from the system.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: windows}
          # 22.04 for its older glibc (2.35): what's built runs on Linux that new or newer.
          - {os: ubuntu-22.04, name: linux-x86_64}
          # macOS 15 rather than macos-latest (26), so the smoke test runs on an older macOS:
          # PySide6's own modules are marked as needing 26, and this shows they load anyway.
          # What the app does need, from PySide6 and Qt, is 14 (see "Oldest macOS" below).
          - {os: macos-15, name: macos-arm64}         # Apple silicon
          - {os: macos-15-intel, name: macos-x86_64}  # Intel Macs
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a build takes ~5; past this something has hung
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt's libraries for its X11 plugin, which the build packs into the GUI if they're here
      # (PyInstaller leaves out only what every desktop has: libxcb, libGL, libEGL, Wayland's).
      # And a display for trying the GUI.
      - name: Libraries Qt needs on Linux
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends
          libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
          libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
          xvfb xauth

      - name: Install NDPT with both front ends and the build tools
        run: python -m pip install -e ".[dev,tui,gui,build]"

      - name: Check the tag matches NDPT's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          have=$(python -c "import importlib.metadata as m, ndpt; print(m.version('ndpt'), ndpt.__version__)" | tr -d '\r')
          want="${GITHUB_REF_NAME#v}"
          if [ "$have" != "$want $want" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but pyproject.toml and ndpt/__init__.py say '$have'. Bump both, then tag again."
            exit 1
          fi

      - name: Test
        # Not the "network" tests: they send real ICMP, which GitHub's machines may not pass.
        run: python -m pytest -q -m "not network"

      - name: Build
        run: python packaging/build.py --release

      - name: Start the GUI and quit it
        timeout-minutes: 5
        run: |
          case "$RUNNER_OS" in
            Windows) python packaging/smoke.py dist/ndpt-gui.exe --demo ;;
            Linux)   QT_QPA_PLATFORM=xcb xvfb-run -a python packaging/smoke.py dist/ndpt-gui --demo ;;
            macOS)   python packaging/smoke.py dist/ndpt-gui.app --demo ;;
          esac

      - name: Start the TUI and quit it
        if: runner.os != 'Windows'  # it needs a pseudo-terminal
        timeout-minutes: 5
        run: python packaging/smoke.py dist/ndpt-tui --demo

      - name: Both again, on a bare Ubuntu 24.04 with only a display added
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: docker run --rm -v "$PWD:/ndpt" -w /ndpt ubuntu:24.04 bash packaging/bare_linux.sh

      - name: Oldest macOS each needs (to know; the highest is the answer)
        if: runner.os == 'macOS'
        run: |
          find dist/ndpt-gui.app -type f | while read -r f; do
            otool -l "$f" 2>/dev/null | awk -v f="${f#dist/}" '/LC_BUILD_VERSION/ {b = 1} b && /minos/ {print $2, f; b = 0}'
          done | sort -V -u > minos.txt
          cut -d' ' -f1 minos.txt | uniq -c
          echo "Needing 13 or newer:"
          awk '$1 + 0 >= 13' minos.txt

      - uses: actions/upload-artifact@v7
        with:
          name: ndpt-${{ matrix.name }}
          path: dist/release/*
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5  # for the notes

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" release/*
          --title "NDPT ${{ github.ref_name }}"
          --notes-file packaging/release-notes.md --generate-notes
